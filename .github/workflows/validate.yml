name: Validate game

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Static and unit validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Discover sources instead of listing them: a hardcoded list silently skips
      # new files and hard-fails the whole job on ones that get deleted.
      - name: Check JavaScript syntax
        run: |
          find tools src tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -r -n1 node --check
          node --check playwright.config.mjs

      - name: Validate static build
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run validate 2>&1 | tee test-results/static-validation.log

      - name: Validate module graph
        run: npm run validate:modules

      - name: Test Nesměň data contract
        run: node --test --test-reporter=spec tests/unit/nesmen-data.test.mjs

      - name: Test Nesměň objective contract
        run: node --test --test-reporter=spec tests/unit/nesmen-objective-system.test.mjs

      - name: Test modular core
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:unit 2>&1 | tee test-results/unit-validation.log

      - name: Upload static validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: static-validation-report
          path: |
            test-results/static-validation.log
            test-results/unit-validation.log
          if-no-files-found: ignore
          retention-days: 14

  browser-smoke:
    name: Playwright — ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - desktop-firefox
          - offline-chromium
          - audio-lifecycle-chromium
          - iphone-portrait
          - iphone-portrait-smoke
          - iphone-landscape

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install browser binaries
        run: |
          npx playwright install --with-deps --only-shell chromium
          npx playwright install --with-deps firefox

      - name: Run ${{ matrix.project }}
        run: |
          if [ "${{ matrix.project }}" = "desktop-firefox" ]; then
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run --auto-servernum npm run test:smoke -- --project="${{ matrix.project }}"
          else
            npm run test:smoke -- --project="${{ matrix.project }}"
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
