name: One-shot regenerate v7.3 procedural audio

on:
  push:
    branches:
      - agent/audio-procedural-reset-269

permissions:
  contents: write

concurrency:
  group: one-shot-v73-audio-procedural-reset
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Regenerate canonical procedural audio
        run: python3 tools/audio/build-v73-audio.py

      - name: Reconcile manifest and provenance metadata
        run: python3 tools/audio/update-v73-audio-metadata.py

      - name: Remove unused unlicensed alternates
        run: rm -f assets/audio/ambient-nesmen2.mp3 assets/audio/ambient-slavia2.mp3

      - name: Verify canonical audio uniqueness and provenance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("assets/audio/v73-audio-build-audit.json").read_text())
          rows = audit["files"]
          assert len(rows) == 21, len(rows)
          assert len({row["sha256"] for row in rows}) == 21
          assert all(row["license_spdx"] == "CC0-1.0" for row in rows)
          assert all(row["technical_metadata_verified"] is True for row in rows)
          assert audit["total_bytes"] < 5_000_000
          by_name = {row["file"]: row for row in rows}
          assert by_name["finding-b.mp3"]["sha256"] != by_name["finding-c.mp3"]["sha256"]
          PY

      - name: Commit regenerated canonical set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/audio assets/manifests/assets.json sw.js
          git rm .github/workflows/regenerate-v73-audio-once.yml
          git commit -m "fix(audio): restore canonical procedural CC0 set"
          git push origin HEAD:${GITHUB_REF_NAME}
