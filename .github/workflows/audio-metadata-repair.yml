name: Repair audio metadata branch

on:
  push:
    branches:
      - agent/audio-upload-metadata-fix

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/audio-upload-metadata-fix

      - name: Regenerate canonical audio metadata
        run: python3 tools/audio/update-v73-audio-metadata.py

      - name: Commit generated metadata
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/manifests/assets.json assets/audio/LICENSE.md sw.js; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/manifests/assets.json assets/audio/LICENSE.md sw.js
          git commit -m "fix(audio): sync uploaded asset metadata"
          git push origin HEAD:agent/audio-upload-metadata-fix
